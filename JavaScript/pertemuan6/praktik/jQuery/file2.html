<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <title>Selector Hirarki</title>
</head>
<body>
    <div>
        <h2>Judul</h2>
        <p>Paragraph dalam div</p>
    </div>

    <p>Paragraph di luar div</p>

    <button id="ubah">Sorot paragraph didalam div</button>

    <script>
        $(document).ready(function(){
            $('#ubah').click(function(){
                $("div p").css("background-color", "blue")
            })
        })
    </script>
</body>
</html>
